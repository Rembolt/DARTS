<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acoustic Experience</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      #viewer {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* Exactly over the tour, and never in the way of the mouse (mvp-design.md 7). */
      #blueprint {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #blueprint[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <iframe id="viewer" allow="fullscreen; xr-spatial-tracking"></iframe>
      <canvas id="blueprint" hidden></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
