<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acoustic Experience</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow-x: hidden;
        font: 13px/1 system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        flex: none;
        overflow: hidden;
        white-space: nowrap;
        background: #111;
        color: #eee;
      }
      header p {
        margin: 0;
      }
      #status,
      #pose {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #pose {
        font-family: ui-monospace, monospace;
        color: #9cf;
      }
      #viewer {
        flex: 1;
        min-height: 0;
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <p id="status">Loading…</p>
      <p id="pose"></p>
    </header>
    <iframe id="viewer" allow="fullscreen; xr-spatial-tracking"></iframe>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
