<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acoustic Experience</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow-x: hidden;
        font: 13px/1 system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      /* One page, two states (main.ts shows one): the tour fills the window as the body did before. */
      #tour {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      #tour[hidden],
      #front[hidden] {
        display: none;
      }
      #front {
        padding: 24px;
        line-height: 1.4;
      }
      /* The not-possible screen (tour/failure.ts) replaces the tour's header and stage. */
      #tour .failure {
        padding: 24px;
        font-size: 15px;
        line-height: 1.5;
      }
      #tour .failure p {
        display: flex;
        gap: 16px;
        align-items: center;
        margin: 0 0 12px;
      }
      #tour .failure button {
        height: 26px;
        padding: 0 12px;
        font: inherit;
        cursor: pointer;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        flex: none;
        overflow: hidden;
        white-space: nowrap;
        background: #111;
        color: #eee;
      }
      header p {
        margin: 0;
      }
      #status,
      #pose,
      #sim {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #pose {
        font-family: ui-monospace, monospace;
        color: #9cf;
      }
      #sim {
        color: #bdb;
      }
      #blueprint-toggle,
      #blueprint-mode,
      #audio-toggle {
        flex: none;
        height: 20px;
        padding: 0 10px;
        border: 1px solid #555;
        border-radius: 3px;
        background: #222;
        color: #eee;
        font: inherit;
        cursor: pointer;
      }
      #blueprint-toggle[aria-pressed='true'] {
        background: #1f3a93;
        border-color: #1f3a93;
      }
      #audio-toggle[aria-pressed='true'] {
        background: #2e7d32;
        border-color: #2e7d32;
      }
      #blueprint-toggle:disabled,
      #blueprint-mode:disabled,
      #audio-toggle:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #viewer {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* Exactly over the tour, and never in the way of the mouse (mvp-design.md 7). */
      #blueprint {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #blueprint[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="tour" hidden>
      <header>
        <button id="blueprint-toggle" type="button" aria-pressed="false" disabled>Blueprint</button>
        <button id="blueprint-mode" type="button" disabled>X-ray</button>
        <button id="audio-toggle" type="button" aria-pressed="false">Start audio</button>
        <p id="status">Loading…</p>
        <p id="pose"></p>
        <p id="sim"></p>
      </header>
      <div id="stage">
        <iframe id="viewer" allow="fullscreen; xr-spatial-tracking"></iframe>
        <canvas id="blueprint" hidden></canvas>
      </div>
    </div>
    <main id="front" hidden></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
