# fly.toml app configuration file generated for darts-oodfmq on 2026-11-15T11:57:18Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'darts-oodfmq'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  CACHE_DIR = '/data/cache'
  HOST = '0.0.0.0'
  PORT = '8080'
  RATE_LIMIT_PER_MIN = '30'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'darts_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
